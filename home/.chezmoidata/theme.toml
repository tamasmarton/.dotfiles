# glacier-night — egyetlen paletta, ebből generálódik minden eszköz színe
# (WezTerm, tmux, Starship, Neovim, bat, lazygit, fzf, delta).
# Ihlet: Glacier téma, josean dev-environment, saját energiamérleg dashboard.
# Sablonban: {{ .theme.accent }}, {{ .theme.ansi.red }} stb.

[theme]
name = "glacier-night"
font = "JetBrainsMono Nerd Font"

bg = "#050B11"          # fő háttér
bg_alt = "#0A1620"      # státuszsor, popupok
bg_highlight = "#143652" # aktív sor, keretek
selection = "#033259"
fg = "#CBE0F0"
fg_bright = "#E6EDF3"
muted = "#64748B"       # kommentek, inaktív elemek
border = "#547998"

accent = "#03E2C9"      # teal — fő kiemelőszín
cursor = "#47FF9C"

[theme.ansi]
black = "#0E141C"
red = "#FF4A4A"
green = "#00FF88"
yellow = "#F6C945"
blue = "#3B82F6"
magenta = "#C026D3"
cyan = "#3DADD7"
white = "#CBE0F0"

[theme.bright]
black = "#64748B"
red = "#FF6B6B"
green = "#47FF9C"
yellow = "#FFE073"
blue = "#60A5FA"
magenta = "#FF4A90"
cyan = "#03E2C9"
white = "#F8FAFC"

[theme.extra]
orange = "#FF9A3C"
pink = "#FF4A90"

# Kódszínezés (VS Code; később a Neovim is használhatja).
# A neon alapszínek kicsit tompítva, hogy hosszú kódolásnál se legyen fárasztó.
[theme.syntax]
comment = "#5A6B82"     # tompa szürkéskék, dőlt
keyword = "#03E2C9"     # teal — if, return, import, func
storage = "#3DADD7"     # cyan — const, let, public, static, class
func = "#7AB8FF"        # világoskék — függvény / metódus nevek
type = "#F6C945"        # sárga — típusok, osztályok, interfészek
string = "#5FD7A7"      # menta — stringek
number = "#FF9A3C"      # narancs — számok, true/false, null
constant = "#FFB86B"    # világos narancs — konstansok, enum értékek
variable = "#CBE0F0"    # alap szöveg
parameter = "#E2C9FF"   # halvány lila, dőlt — paraméterek
property = "#9CCFE8"    # jégkék — mezők, objektum kulcsok
operator = "#7F97B2"    # = + => . ,
tag = "#FF4A90"         # pink — HTML / JSX tagek
attribute = "#FFD580"   # halvány sárga — HTML attribútumok
decorator = "#E879F9"   # magenta — @Annotation, @decorator
builtin = "#FF6FA8"     # pink, dőlt — this, self, super
namespace = "#8BA7FF"   # package, namespace, modul
regex = "#FF9A3C"
escape = "#FF4A90"
