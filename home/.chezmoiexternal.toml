# Külső forrásból letöltött dolgok (git repók), hetente frissülnek a `chezmoi apply`-jal.

# zsh pluginkezelő — git repóból, így Macen és devcontainerben is ugyanúgy működik
[".local/share/antidote"]
    type = "git-repo"
    url = "https://github.com/mattmc3/antidote.git"
    refreshPeriod = "168h"
    [".local/share/antidote".clone]
        args = ["--depth", "1"]
    [".local/share/antidote".pull]
        args = ["--ff-only"]

# tmux pluginok — tpm helyett közvetlenül a chezmoi tölti le, a tmux.conf `run-shell`-lel tölti be
[".config/tmux/plugins/vim-tmux-navigator"]
    type = "git-repo"
    url = "https://github.com/christoomey/vim-tmux-navigator.git"
    refreshPeriod = "168h"
    [".config/tmux/plugins/vim-tmux-navigator".clone]
        args = ["--depth", "1"]

[".config/tmux/plugins/tmux-resurrect"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-resurrect.git"
    refreshPeriod = "168h"
    [".config/tmux/plugins/tmux-resurrect".clone]
        args = ["--depth", "1"]

[".config/tmux/plugins/tmux-continuum"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-continuum.git"
    refreshPeriod = "168h"
    [".config/tmux/plugins/tmux-continuum".clone]
        args = ["--depth", "1"]
