# Profil: personal — személyes gép. Nincs benne személyes adat, ez a repóba kerül.
# Az `install.sh` / `chezmoi init` elején ezek közül választasz (a profiles/*.toml fájlnevek a lehetőségek).
# A gépspecifikus adatokat (név, email) az env fájl adja: lásd env.example.toml.

title = "személyes gép"
description = "Minden app, személyes kiegészítők (Brave, Spotify, VLC …)."

# Alapérték; az env fájl vagy a kérdés felülírja
# GUI-s rész (casks, VS Code téma, WezTerm/Ghostty, macOS defaults)
gui = true

signCommits = false

# Céges gépen true: külön, személyes git email a személyes repókhoz
askPersonalEmail = false
# Ebben a mappában a repók a személyes emailt kapják (üres = nincs ilyen szabály)
personalGitDir = ""
