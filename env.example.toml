# Gépspecifikus adatok — EZ A FÁJL CSAK PÉLDA, nincs benne valódi adat.
#
# Használat (gépenként egyszer):
#   mkdir -p ~/.config/dotfiles
#   cp env.example.toml ~/.config/dotfiles/env.toml
#   $EDITOR ~/.config/dotfiles/env.toml
#   chezmoi init          # felveszi az értékeket; ha mindent megadsz, nem kérdez semmit
#
# A valódi ~/.config/dotfiles/env.toml a repón kívül van, soha nem kerül verziókezelésbe.
# Más helyről is betölthető: DOTFILES_ENV_FILE=/path/env.toml chezmoi init
#
# Sorrend (az első találat nyer): env fájl → DOTFILES_* környezeti változó → korábbi chezmoi
# válasz → kérdés. Minden kulcs elhagyható; ami hiányzik, azt a `chezmoi init` megkérdezi.

# Melyik profil: a profiles/*.toml fájlnevei (personal, work, …)
profile = "personal"

# Git azonosság — a ~/.config/git/config [user] része. Ha üres, nem kerül bele semmi
# (pl. devcontainerben a VS Code adja át a hoszt git azonosságát).
name = "Your Name"
email = "you@example.com"

# Csak céges profilnál: a személyes repók (profiles/work.toml: personalGitDir) emailje
personalEmail = ""

# Commitok aláírása az SSH kulccsal (~/.ssh/id_ed25519.pub). Hiányzó kulcsnál kimarad.
signCommits = false
